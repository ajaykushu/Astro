<div class="container-fluid">
  <table class="table table-responsive-sm">
    <thead>
      <tr>
        <th width="30px" style="text-align:center">
          <input type="checkbox" class="form-check-input" (change)="selectAll()" />
        </th>
        <th *ngFor="let data of displayedColumns">
          <div class="head-group">
            <span>{{data.name | titlecase}} <span class="resize-handle"></span></span>
            <span *ngIf="data.sortable" role="button" (click)="sort(data)"><i-bs [name]="data.icon"></i-bs></span>
          </div>

        </th>

      </tr>

    </thead>
    <tbody>
     
      <tr *ngFor="let row of  dataSource">
        <td width="30px">
          <input type="checkbox" class="form-check-input" (change)="select(row['id'],$event)" />
        </td>
        <td *ngFor="let data of displayedColumns">
          <div> {{row[data.name]}}</div>
        </td>
      </tr>
    </tbody>
  </table>

  <nav aria-label="Page navigation" >
    <ul class="pagination">
      <li>
        <a role="button"><</a>
      </li>
      <li> <a role="button"><</a></li>
      <li>   <a role="button">></a></li>
      <li>
        <a role="button">>></a>
      </li>
     
    </ul>
  </nav>
</div>
<style>
  .pagination {
    flex-direction: row;
    display: inline-flex;
    gap: 16px;
  }
</style>
